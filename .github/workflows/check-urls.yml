name: 公式URLの点検
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check-urls.js
      - uses: actions/upload-artifact@v4
        with:
          name: url-check-report
          path: |
            url-check-report.md
            url-check-report.json
